name: Build iOS App

on:
  workflow_call:
    inputs:
      ref:
        description: 'The git reference to build'
        required: true
        type: string
    secrets:
      FLUTTER_GOOGLE_SERVICES:
        description: 'Base64 encoded Google Services credentials JSON'
        required: true
      FLUTTER_GOOGLE_CLIENT_ID:
        description: 'Google Client ID for Flutter'
        required: true
      IOS_CERT_P12_BASE64:
        description: 'Base64 encoded p12 file for iOS code signing'
        required: true
      IOS_CERT_PASSWORD:
        description: 'Password for the p12 file'
        required: true
      IOS_PROVISION_PROFILE_BASE64:
        description: 'Base64 encoded mobile provisioning profile for iOS code signing'
        required: true
      APPLE_TEAM_ID:
        description: 'Apple Developer Team ID'
        required: true

jobs:
  ios:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.0
          channel: stable
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./playfit-mobile/playfit
      - name: Decode Google Services credentials
        run: echo "${{ secrets.FLUTTER_GOOGLE_SERVICES }}" | base64 --decode > android/app/google-services.json
        working-directory: ./playfit-mobile/playfit
      - name: Set up environment variables
        run: |
          echo "SERVER_BASE_URL=http://${{ vars.FLUTTER_SERVER_IP }}:${{ vars.FLUTTER_SERVER_PORT }}" >> .env
          echo "SERVER_BASE_WS_URL=ws://${{ vars.FLUTTER_SERVER_IP }}:${{ vars.FLUTTER_SERVER_PORT }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.FLUTTER_GOOGLE_CLIENT_ID }}" >> .env
        working-directory: ./playfit-mobile/playfit
      - name: Import codesigning assets
        uses: apple-actions/import-codesign-certs@v3
        with:
          keychain: build
          create-keychain: true
          p12-file-base64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERT_PASSWORD }}
          keychain-password: ${{ secrets.IOS_CERT_PASSWORD }}
      - name: Import provisioning profile
        uses: apple-actions/import-provisioning-profile@v1
        with:
          profile-base64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: ./playfit-mobile/playfit/ios
      - name: Build signed IPA
        run: |
          flutter build ipa --export-options-plist=ios/ExportOptions.plist
        working-directory: ./playfit-mobile/playfit
      # - name: Compress and Upload iOS Build
      #   run: |
      #     cd build
      #     tar -czf ios_build.tar.gz ios
      #   working-directory: ./playfit-mobile/playfit
      # - name: Upload iOS Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ios-build
      #     path: ./playfit-mobile/playfit/build/ios_build.tar.gz
      - name: Upload build artifact (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ./playfit-mobile/playfit/build/ios/ipa/*.ipa